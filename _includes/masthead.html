<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/about/' %}selected{% endif %}">
            <a href="{{ '/about/' | relative_url }}">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              {% if link.url contains 'http' %}
              <a href="{{ link.url }}">{{ link.title }}</a>
              {% else %}
              <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
              {% endif %}
            </li>
          {% endfor %}
          <li id="fancy-link" class="masthead__menu-item persist tail">
            <a href="{{ '/' | relative_url }}" aria-label="If you prefer something fancier" data-tooltip="If you prefer something fancier"><i class="fa-solid fa-sun" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
